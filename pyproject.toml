[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-lejepa"
version = "1.0.0"
description = "Geometry-aware self-supervised pretraining for dark matter substructure in strong lensing images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# The DLens agent framework itself is NOT listed here: it is not published on
# PyPI and its own dependency set (llama-cpp-python, numba, mcp, pandas) is not
# needed for the planner/report path. Run scripts/install_agent_deps.sh, which
# installs it from a pinned commit with --no-deps.
# The agent extra needs Python >= 3.12, the version DLens itself requires.
agent = [
    "pydantic-ai>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]
# Synthetic bring-up data generation (lenstronomy). Not needed for training
# or evaluation; see configs/data/sim.yaml and README "Synthetic dataset".
sim = ["lenstronomy>=1.14,<2"]

[project.scripts]
lens-lejepa = "lens_lejepa.cli:main"

[tool.setuptools.packages.find]
include = ["lens_lejepa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
